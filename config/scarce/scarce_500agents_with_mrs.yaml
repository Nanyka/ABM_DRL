default_settings: null
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0005 # 0.0005 (v6.4.1 --> ...)
      beta: 0.005 # change from 0.005
      epsilon: 0.1 # change from 0.1
      lambd: 0.95
      num_epoch: 3
      shared_critic: true
      learning_rate_schedule: linear # linear first
      beta_schedule: linear # linear first
      epsilon_schedule: linear # constant first
    network_settings:
      normalize: true
      hidden_units: 256 # 128 first
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    checkpoint_interval: 1000000
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 50000

environment_parameters:
    # Exchange with scarce food: lopsided endowments as in config/exchange, plus a thin harvest
    uniform_capacity: 1 # every cell holds at most 1 sugar and 1 spice
    start_empty: true # cells begin empty and fill by regrowth only
    regain_rate: 1
    metabolism_sugar: 2 # harvesting covers at most half of what an agent burns
    metabolism_spice: 2
    poor_endowment: 15 # the scarce good
    initiated_sugar: 300 # sugar-rich agents start (300, 15)
    initiated_spice: 1200 # spice-rich agents start (15, 1200)
    vision_range: 10
    trade_range: 1
    capacity_sugar: 10000
    capacity_spice: 10000
    scarcity: 0
    number_of_episode: 100
    number_of_agents: 500
    random_map: true
    is_perfect_info: true
    is_random_state: false
    model_index: 0
    obs_version: 2
    resource_only_obs: false
