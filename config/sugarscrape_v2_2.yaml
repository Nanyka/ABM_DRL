default_settings: null
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024 # learn from vast number of observations
      buffer_size: 10240
      learning_rate: 0.0001
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    checkpoint_interval: 3000000
    max_steps: 3000000
    time_horizon: 64
    summary_freq: 50000

environment_parameters:
    regain_rate: 2
    vision_range: 3
    trade_range: 1
    capacity_sugar: 20 # more storage space
    capacity_spice: 20 # more storage space
    initiated_sugar: 5
    initiated_spice: 5
    metabolism_sugar: 2
    metabolism_spice: 2
    scarcity: 1
    number_of_episode: 100
    number_of_agents: 50
